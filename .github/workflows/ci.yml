name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nastechresearch/100Ways
          path: _deps/100ways
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          if [ -f pyproject.toml ]; then pip install -e '.[dev]'; fi
      - name: Test
        env:
          CODEFOUNDRY_100WAYS_PATH: ${{ github.workspace }}/_deps/100ways
        run: python -m pytest -q
