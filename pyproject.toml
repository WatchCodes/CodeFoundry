[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "watchcodes-codefoundry"
version = "0.1.0"
description = "CodeFoundry: turn an approved MigrationRequest into a verified destination repository and exactly one MigrationReport."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "WatchCodes" }]
dependencies = [
  "jsonschema>=4.21,<5",
]

[project.scripts]
codefoundry = "codefoundry.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools]
packages = ["codefoundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
